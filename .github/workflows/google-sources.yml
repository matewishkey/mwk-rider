# Has Google moved under us?
#
# The tool calls a rule "universal" when ignoring it is a real defect on anyone's
# site, and for most of those the authority is a page on Google Search Central.
# Those pages change — FAQ rich results were retired, HowTo went away, the
# favicon format list was rewritten — and a tool that encoded any of that and
# never re-read it would go on reporting the old rule with total confidence.
#
# `docs/sources.json` records each page's printed "Last updated" date and the
# date we read it. This job re-reads them weekly and opens an issue when one has
# moved, naming the rules that rest on it, so a human re-reads that one page
# rather than all of them. Nothing here decides WHAT changed: a diff of Google's
# prose is not a thing a script should judge.
#
# It is deliberately NOT part of the test gate. A PR must not go red because
# Google published something on a Tuesday, and the network is not a build input.
name: google-sources

on:
  schedule:
    # Mondays, 07:00 UTC. Weekly is the right cadence for documentation that
    # moves a few times a year: often enough that a change is caught inside a
    # release cycle, rare enough that the issue means something when it appears.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Re-read every Google source
        id: check
        run: |
          # No pipe into tee: `$?` after a pipeline is the LAST command's status,
          # so `node … | tee` would report tee's 0 and this job would never fire.
          set +e
          node scripts/google-sources.mjs > sources.txt
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat sources.txt
          node scripts/google-sources.mjs --json > sources.json
        continue-on-error: true

      # One issue, updated rather than duplicated: a page that has been moved for
      # three weeks should not produce three issues.
      - name: Open or update the issue
        if: steps.check.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Google Search Central changed under us"
          BODY=$(printf '%s\n\n```\n%s\n```\n\n%s\n' \
            "One or more pages in \`docs/sources.json\` no longer print the date we recorded." \
            "$(cat sources.txt)" \
            "Re-read each page named above, confirm the rules it backs still say what Google says, then run \`node scripts/google-sources.mjs --accept\` and commit.")
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
